limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
server {
    listen 8080;
    server_name _;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
    }
    location /api/ { proxy_pass http://api:8000; proxy_read_timeout 30s; }
    location = /webhooks/line { client_max_body_size 1m; proxy_pass http://api:8000; }
    location /health/ { proxy_pass http://api:8000; }
    location / { proxy_pass http://web:8080; }
}
